[project]
name = "osm-tokyo23-src-2026-08"
version = "0.1.0"
description = "Frozen OpenStreetMap extract of Tokyo's 23 wards, and the code that rebuilds and lays out its Parquet"
requires-python = ">=3.12"
dependencies = [
    # 08 and 09 run on the host. 07 runs its own pinned DuckDB in Docker.
    "duckdb==1.5.6",
    "huggingface-hub>=1.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
