# Where this data comes from. Everything needed to rebuild it.
source:
  name: OpenStreetMap planet
  file: planet-260831.osm.pbf
  snapshot: 2026-08-31
  url: https://planet.openstreetmap.org/pbf/planet-260831.osm.pbf
  size: 94612383571
  md5: c67437924cf55de40e8708c7192f354d
  retention_note: |
    OSM keeps its dated planet files for about ten years, so this URL is
    expected to outlive most copies of this dataset. It is the one link that
    makes the whole chain checkable: fetch it, verify the md5, and every step
    below can be run again.
  license: ODbL
  license_note: |
    OSM distributes planet files under ODbL, and this extract inherits it:
    attribute the source, and share alike if you redistribute a modified
    version.

extent:
  name: 東京都区部 / Tokyo Special Wards
  rule: |
    Administrative relations at admin_level=7 inside 東京都 whose name ends
    with 区. Within Tokyo that matches exactly the 23 special wards; the
    admin_level guard keeps the wards of other designated cities out.
  count: 23
  boundary_file: tokyo23_osm_boundary.geojson
  boundary_note: |
    Derived from the same snapshot as the data. Taking it from anywhere else
    invites a vintage mismatch: a boundary drawn a year earlier once dropped
    way/1553541361, created 2026-08-30, which broke Setagaya's ring and with
    it every area query for that ward. Nothing in the totals showed it.

extraction:
  tool: osmium-tool 1.16.0 (libosmium 2.20.0)
  strategy: complete_ways
  note: |
    A way with at least one node inside the wards is kept whole, including the
    nodes that fall outside. Nothing is cut at the boundary, so the bounding
    box of the result reaches well past the wards: the Ogasawara ferry route
    leaves from Takeshiba pier and runs a thousand kilometres south.

parquet:
  built_from: tokyo23-260831.osm.pbf
  chain:
    - tool: osm2pgsql
      version: 1.11.0+ds-1
      output: pgsql (classic)
      style: default.style, md5 ca34bbc54e6113a4b01e588e8f085f15
      flags: [--hstore]
      projection: EPSG:3857 (osm2pgsql's default; no -l, -E or -G)
      note: |
        The style decides which tags become columns, so it is pinned by
        checksum rather than by the package version. --hstore is not optional
        here: opening_hours, start_date, building:levels and operator:en are
        not promoted to columns by this style, and questions ask about them.
    - tool: postgis/postgis docker image
      version: 16-3.4
    - tool: duckdb
      version: 1.5.5
      script: scripts/07_export_parquet.py
      output: tmp/parquet-export/ (not published)
      note: |
        Reads the PostGIS tables and writes the Parquet, in the order PostGIS
        returns rows and with no GeoParquet metadata. The 1.5 line is
        required; earlier lines misbehave here. These are the files published
        until 2026-10-07; their md5 sums were checked against the old
        checksums.md5 before the relayout read them.
    - tool: duckdb (Python) with the spatial extension
      version: 1.5.6
      script: scripts/08_relayout_parquet.py
      output: parquet/ (published)
      done: 2026-10-07
      note: |
        Rewrites the export of 07 for spatial reading, with the same code as
        osm-japan-src-2026-08. No value changes; 09 checks that.
      order: |
        ST_Hilbert of the bbox centre of each geometry, over the whole
        EPSG:3857 square (+-20037508.342789244 m, 16 bits an axis), then
        osm_id, then the WKB bytes. No DOUBLE column is a sort key: DuckDB
        1.5.6 returns -0.0 as 0.0 from a DOUBLE used directly in ORDER BY.
      row_groups: |
        Sized to about 4 MiB uncompressed from each table's own bytes per
        row: point 26,624 rows (12 groups), line 18,432 (19), polygon 20,480
        (71), roads 6,144 (6). Chosen by measurement, not carried over from
        Japan's 32 MiB. For a 1 km box around Tokyo station the polygon table
        kept 4/9 groups (74 MB) at 32 MiB, 5/34 (23 MB) at 8 MiB, 6/71
        (13 MB) at 4 MiB and 6/141 (7 MB) at 2 MiB; 2 MiB doubled the footer
        to 863 KB, made the four files 5% larger and put roads at the
        2,048-row floor.
      covering: |
        bbox struct<xmin, ymin, xmax, ymax> of doubles, equal to
        ST_Extent(way) on every row, appended after the osm2pgsql columns.
      geo_metadata: |
        GeoParquet 1.1.0. primary_column way, encoding WKB, geometry_types
        [Point] / [LineString] / [Polygon] / [LineString], the extent, the
        bbox covering, and crs as the PROJJSON of EPSG:3857 from the PROJ
        database inside DuckDB spatial.
      crs_evidence: |
        05_load_postgis.sh passes --hstore and no -l, -E or -G, so osm2pgsql
        uses its default EPSG:3857, which is what PostGIS records as
        geometry(*, 3857). ST_AsBinary drops the SRID, so it was checked from
        the numbers: node 2149761647 (東京, railway=station) is
        (15558758.54, 4256850.67) in the export, and the inverse of EPSG:3857
        gives 139.766706, 35.6812546, its position in the pbf.
      verification: |
        scripts/09_verify_parquet.py on all four tables against the export:
        same 70 columns in order, same row count and same hash digests over
        every column (way as bytes, FLOAT as text), same -0.0 and NaN counts
        (none in way_area, before or after), Hilbert order,
        bbox = ST_Extent(way), and the geo metadata equal to the one
        recomputed from the data. All passed on 2026-10-07. An exact EXCEPT
        ALL of all columns in both directions also returned 0 rows for each
        table, and the cafe count for 千代田区 is still 507.
  conversions:
    - column: way
      from: geometry(*, 3857)
      to: WKB bytes, still EPSG:3857, declared in the GeoParquet metadata
    - column: tags
      from: hstore
      to: JSON text
  added:
    - column: bbox
      what: struct<xmin, ymin, xmax, ymax> of doubles, ST_Extent(way) in EPSG:3857
      why: |
        Its row group statistics let a reader skip groups for a bbox query.
        WKB bytes have no usable statistics.
  unchanged: |
    The other 68 columns keep the names and types osm2pgsql gave them, in
    the same order. No column was renamed or dropped and the projection was
    not changed, so a query written against planet_osm_point in PostGIS reads
    almost the same against the Parquet. The only column added is bbox, last.

verification:
  ward_rings: 1191/1191 boundary ways present, no ward incomplete
  cross_engine: |
    The same question, the count of amenity=cafe nodes per ward, was answered
    in PostGIS, in Overpass and in DuckDB over the Parquet. All 23 wards agree
    across all three.

not_included:
  - what: 多摩地域 (Tama, the cities west of the wards)
    reason: Out of extent. The wards are the whole of it.
  - what: 島嶼部 (the Izu and Ogasawara islands)
    reason: |
      Administratively part of Tokyo but not of the 23 wards. Including them
      would stretch the bounding box across 18 degrees of longitude.
  - what: a -G / --multi-geometry load
    reason: |
      Left at osm2pgsql's default, so a multipolygon relation occupies several
      rows sharing one osm_id. Yoyogi Park, relation/19862716, is two rows.
      Aggregate before measuring its area or the distance to its boundary.
